<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">A view frozen at creation time: later writes and deletes don't affect this traversal</text>

  <!-- ============ Top: the frozen view ============ -->
  <rect x="200" y="72" width="880" height="156" rx="12" fill="#f7fbff" stroke="#2563eb" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="228" y="100" font-size="15.5" font-weight="600" fill="#1d4ed8">What this traversal sees</text>
  <text x="410" y="100" font-size="13" fill="#3b82f6">frozen at T0 — read-only and unchanging for the whole traversal</text>

  <!-- Segment 1 -->
  <rect x="228" y="122" width="176" height="66" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="316" y="149" text-anchor="middle" font-size="15" fill="#1e293b">Segment 1</text>
  <text x="316" y="171" text-anchor="middle" font-size="12" fill="#64748b">existing persistent segment</text>
  <!-- Segment 2 -->
  <rect x="420" y="122" width="176" height="66" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="508" y="149" text-anchor="middle" font-size="15" fill="#1e293b">Segment 2</text>
  <text x="508" y="171" text-anchor="middle" font-size="12" fill="#64748b">existing persistent segment</text>
  <!-- Segment 3: sealed at creation -->
  <rect x="612" y="122" width="176" height="66" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="149" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">Segment 3</text>
  <text x="700" y="171" text-anchor="middle" font-size="12" fill="#1d4ed8">sealed at creation</text>

  <!-- Plus sign: distinguish "segment list" from "delete markers" -->
  <text x="806" y="163" text-anchor="middle" font-size="21" fill="#94a3b8">+</text>

  <!-- Cloned delete markers -->
  <rect x="824" y="122" width="228" height="66" rx="7" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="938" y="149" text-anchor="middle" font-size="14.5" fill="#7e22ce">Delete markers · cloned copy</text>
  <text x="938" y="171" text-anchor="middle" font-size="12" fill="#9333ea">decoupled from the live collection</text>

  <text x="228" y="215" font-size="12" fill="#94a3b8">Segment 3 is the writing segment sealed at that instant; deleted rows are skipped during traversal, and deletes after this moment don't affect the result</text>

  <!-- Freeze arrow: T0 -> view -->
  <line x1="240" y1="306" x2="240" y2="236" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)"/>
  <text x="256" y="266" font-size="13.5" font-weight="600" fill="#2563eb">Freeze</text>
  <text x="256" y="286" font-size="11.5" fill="#60a5fa">milliseconds, doesn't block reads/writes</text>

  <!-- ============ Timeline ============ -->
  <line x1="160" y1="316" x2="1108" y2="316" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="1120" y="321" font-size="13.5" fill="#94a3b8">time</text>

  <!-- T0 -->
  <circle cx="240" cy="316" r="8" fill="#2563eb"/>
  <text x="240" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">T0</text>
  <text x="240" y="368" text-anchor="middle" font-size="13.5" fill="#475569" font-family="SF Mono, Menlo, monospace">iter_docs()</text>
  <text x="240" y="388" text-anchor="middle" font-size="13" fill="#475569">create iterator</text>

  <!-- T1 -->
  <circle cx="620" cy="316" r="7" fill="#ea580c"/>
  <text x="620" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#c2410c">T1</text>
  <text x="620" y="368" text-anchor="middle" font-size="13.5" fill="#475569">insert new data</text>

  <!-- T2 -->
  <circle cx="944" cy="316" r="7" fill="#ea580c"/>
  <text x="944" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#c2410c">T2</text>
  <text x="944" y="368" text-anchor="middle" font-size="13.5" fill="#475569">delete old data</text>

  <!-- ============ Bottom: collection keeps changing, but traversal is unaffected ============ -->
  <line x1="620" y1="384" x2="620" y2="424" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  <line x1="944" y1="384" x2="944" y2="424" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowOrange)"/>

  <!-- insert consequence (centered on T1 = 620) -->
  <rect x="466" y="428" width="308" height="98" rx="9" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="456" text-anchor="middle" font-size="14" fill="#334155">new writes go into a new segment 4</text>
  <text x="620" y="484" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">not in the frozen segment list</text>
  <text x="620" y="507" text-anchor="middle" font-size="13" fill="#64748b">→ invisible to this traversal</text>

  <!-- delete consequence (centered on T2 = 944) -->
  <rect x="790" y="428" width="308" height="98" rx="9" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="944" y="456" text-anchor="middle" font-size="14" fill="#334155">modifies the live collection's markers</text>
  <text x="944" y="484" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">the iterator holds a cloned copy</text>
  <text x="944" y="507" text-anchor="middle" font-size="13" fill="#64748b">→ this traversal is unaffected</text>

  <!-- ============ Conclusion bar (aligned with the dashed box above: 200..1080) ============ -->
  <rect x="200" y="562" width="880" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="200" y="562" width="5" height="48" rx="2.5" fill="#2563eb"/>
  <text x="642" y="592" text-anchor="middle" font-size="15" fill="#0f172a">If someone writes to the collection mid-export, you still won't get a mix of old and new data</text>
</svg>
