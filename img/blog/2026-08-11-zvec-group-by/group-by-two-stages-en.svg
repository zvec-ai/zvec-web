<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 610" width="580" height="610">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  </style>

  <rect width="580" height="610" fill="#ffffff"/>

  <!-- Stage 1 label -->
  <rect x="30" y="18" width="260" height="26" rx="6" fill="#EFF6FF"/>
  <text x="160" y="36" text-anchor="middle" font-size="12" font-weight="600" fill="#3B82F6" letter-spacing="0.5">Stage 1: Search + Bucketing</text>

  <!-- Box 1: Group-By Query -->
  <rect x="40" y="56" width="240" height="44" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="83" text-anchor="middle" font-size="13.5" font-weight="500" fill="#1E3A5F">Group-By Query</text>

  <!-- Arrow -->
  <line x1="160" y1="100" x2="160" y2="118" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 2: HNSW 检索 -->
  <rect x="40" y="124" width="240" height="44" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="151" text-anchor="middle" font-size="13.5" fill="#1E3A5F">HNSW Search (topk = G × K)</text>

  <!-- Arrow -->
  <line x1="160" y1="168" x2="160" y2="186" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 3: 分桶 -->
  <rect x="40" y="192" width="240" height="54" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="215" text-anchor="middle" font-size="13.5" fill="#1E3A5F">Bucket by group field</text>
  <text x="160" y="235" text-anchor="middle" font-size="11.5" fill="#64748B">Per-group min-heap (cap K)</text>

  <!-- Arrow -->
  <line x1="160" y1="246" x2="160" y2="264" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Decision: 组数足够？ -->
  <rect x="70" y="270" width="180" height="44" rx="22" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="297" text-anchor="middle" font-size="13.5" font-weight="500" fill="#92400E">groups ≥ group_count ?</text>

  <!-- YES arrow: straight down to result -->
  <line x1="160" y1="314" x2="160" y2="470" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="172" y="332" font-size="12" font-weight="600" fill="#059669">Yes</text>

  <!-- NO arrow: right to Stage 2 -->
  <line x1="250" y1="292" x2="296" y2="292" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="267" y="285" font-size="12" font-weight="600" fill="#D97706">No</text>

  <!-- Stage 2 label -->
  <rect x="300" y="240" width="250" height="26" rx="6" fill="#FFF7ED"/>
  <text x="425" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#EA580C" letter-spacing="0.5">Stage 2: Graph Expansion</text>

  <!-- Box 5: Stage 2 -->
  <rect x="300" y="274" width="250" height="130" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" filter="url(#sh)"/>
  <text x="425" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#C2410C">Only if groups are insufficient</text>
  <text x="425" y="317" text-anchor="middle" font-size="12" fill="#78350F">① Reinsert Stage 1 results as seeds</text>
  <text x="425" y="337" text-anchor="middle" font-size="12" fill="#78350F">② Expand HNSW layer-0 neighbors</text>
  <text x="425" y="357" text-anchor="middle" font-size="12" fill="#78350F">③ New nodes: distance → filter → heap</text>
  <text x="425" y="377" text-anchor="middle" font-size="12" fill="#78350F">④ Reuse Stage 1 visited markers</text>
  <text x="425" y="398" text-anchor="middle" font-size="12" fill="#92400E" font-weight="500">⟳ Until enough groups or scan limit</text>

  <!-- Stage 2 arrow: bent back to result -->
  <path d="M 425 404 L 425 500 L 288 500" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/>

  <!-- Result label -->
  <rect x="30" y="426" width="260" height="26" rx="6" fill="#F0FDF4"/>
  <text x="160" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A" letter-spacing="0.5">Result Construction</text>

  <!-- Box 6: Result -->
  <rect x="40" y="478" width="240" height="54" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="501" text-anchor="middle" font-size="13.5" fill="#14532D">Heap sort → group sort → truncate</text>
  <text x="160" y="521" text-anchor="middle" font-size="11.5" fill="#64748B">Best score by group; relevance within group</text>

  <!-- Arrow -->
  <line x1="160" y1="532" x2="160" y2="550" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 7: Output -->
  <rect x="40" y="556" width="240" height="40" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="581" text-anchor="middle" font-size="13.5" font-weight="500" fill="#065F46">GroupResult List</text>
</svg>
