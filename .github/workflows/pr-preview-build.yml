name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build preview for"
        required: true
        type: string

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.inputs.pr_number) }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api-reference/nodejs-api/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material 'mkdocstrings[python]' black
          pip install zvec
          npm ci

      - name: Build API references
        run: |
          cd ./api-reference/python-api
          mkdocs build
          cd ../nodejs-api
          npm install @zvec/zvec@latest
          cp node_modules/@zvec/zvec/src/index.d.ts ./
          npx typedoc

      - name: Build website
        run: npm run build

      - name: Save PR metadata
        run: |
          mkdir -p ./out/_pr-meta
          printf '%s\n' "${{ github.event.pull_request.number || github.event.inputs.pr_number }}" > ./out/_pr-meta/pr_number
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > ./out/_pr-meta/head_sha

      - uses: actions/upload-artifact@v7
        with:
          name: pages-dist
          path: out
          if-no-files-found: error
          retention-days: 1
