<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zvec — High-Performance Vector Database</title>
  <meta name="description"
    content="Zvec is a lightweight, lightning-fast, in-process vector database for AI applications." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Zvec" />
  <meta property="og:title" content="Zvec — High-Performance Vector Database" />
  <meta property="og:description"
    content="Zvec is a lightweight, lightning-fast, in-process vector database for AI applications." />
  <meta property="og:url" content="https://zvec.org/" />
  <meta property="og:image" content="https://zvec.org/img/header.png" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="zh_CN" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Zvec — High-Performance Vector Database" />

    content="Zvec is a lightweight, lightning-fast, in-process vector database for AI applications." />
  <meta name="twitter:image" content="https://zvec.org/img/header.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://zvec.org/" />

  <style>
    /* Hide body by default; show only if JS is disabled via noscript override */
    body {
      display: none !important;
    }

    .noscript-fallback {
      display: block !important;
    }
  </style>
  <!-- Redirect based on browser language before page renders -->
  <script>
    const userLang = navigator.language || navigator.userLanguage || 'en';
    const target = userLang.startsWith('zh') ? '/zh/' : '/en/';
    window.location.replace(target);
  </script>
</head>

<body>
  <noscript>
    <style>
      .noscript-fallback {
        display: block !important;
      }
    </style>
  </noscript>
  <div class="noscript-fallback"
    style="display: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 3rem 1.5rem; text-align: center; max-width: 480px; margin: 0 auto;">
    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Zvec</h1>
    <p style="color: #555; margin-bottom: 2rem;">Please select your preferred language to continue.</p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="/en/"
        style="display: inline-block; padding: 0.6rem 1.5rem; background: #111; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500;">
        English
      </a>
      <a href="/zh/"
        style="display: inline-block; padding: 0.6rem 1.5rem; background: #111; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500;">
        中文
      </a>
    </div>
  </div>
</body>

</html>
