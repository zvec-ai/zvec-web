<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Taking local search performance further</title>
  <desc id="desc">zg Rust 0.3.0: 64.5% less total indexing time and 53.2% lower mean peak build RSS across four BEIR corpora.</desc>
  <rect width="1600" height="900" fill="#f3f7fd"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="112" y="126" font-size="26" font-weight="600" letter-spacing="5" fill="#4c6585">ZVEC / LOCAL SEARCH</text>
    <rect x="1168" y="80" width="320" height="72" rx="36" fill="#ffffff" stroke="#d6e1ef" stroke-width="2"/>
    <text x="1328" y="126" text-anchor="middle" font-size="29" font-weight="650" fill="#1765c1">RUST 0.3.0</text>
    <text x="112" y="341" font-size="190" font-weight="750" letter-spacing="-10" fill="#142d4e">zg</text>
    <text x="112" y="433" font-size="48" font-weight="600" fill="#142d4e">Taking local search performance further</text>
    <g fill="none" stroke="#1765c1" stroke-width="18" stroke-linecap="round">
      <circle cx="1320" cy="281" r="65"/>
      <path d="M1366 327l66 66"/>
      <path d="M1191 254h-53m53 44h-84" stroke-width="9"/>
    </g>
    <rect x="112" y="510" width="664" height="220" rx="24" fill="#ffffff" stroke="#d6e1ef" stroke-width="2"/>
    <rect x="800" y="510" width="688" height="220" rx="24" fill="#ffffff" stroke="#d6e1ef" stroke-width="2"/>
    <text x="152" y="622" font-size="94" font-weight="700" fill="#1765c1">64.5%</text>
    <text x="152" y="683" font-size="30" fill="#4c6585">Less total indexing time</text>
    <text x="840" y="622" font-size="94" font-weight="700" fill="#1765c1">53.2%</text>
    <text x="840" y="683" font-size="30" fill="#4c6585">Lower mean peak build memory</text>
    <text x="112" y="810" font-size="27" fill="#4c6585">BEIR · 4 corpora · 75,128 documents</text>
